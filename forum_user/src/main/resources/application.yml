server:
  port: 8081  # 与forum-start不同的端口

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/forum_user?useSSL=false&characterEncoding=utf8
    username: forum_user
    password: secure_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 15

  redis:
    host: localhost
    port: 6379
    password: redis_password
    database: 1  # 与forum-start使用不同数据库

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

# 用户模块配置
forum:
  user:
    profile:
      cache-ttl: 30m  # 缓存时间
      default-avatar: /avatars/default.png

dubbo:
  application:
    name: forum-user-service
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://localhost:8848 # 使用 Nacos 注册中心