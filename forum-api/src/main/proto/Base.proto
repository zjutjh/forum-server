syntax = "proto3";

option java_multiple_files = true;

import "google/protobuf/any.proto";

package org.jh.forum.api.dubbo;

/**
 * 服务结果
 * 请保证所有 rpc 接口的返回值都带上本类，以便区分网络异常和业务异常
 */
message ServiceResult {
  bool isSuccess = 1;
  string errorCode = 2;
  string errorMsg = 3;
  google.protobuf.Any data = 4;
}

message BaseListReq{
  int32 page = 1;
  int32 pageSize = 2;
}

message UserInfo {
  int64 id = 1;
  string nickname = 2;
  string avatar = 3;
}