syntax = "proto3";
import "Base.proto";
option java_multiple_files = true;

package org.jh.forum.api.dubbo;

// ==================== 协议文档说明 ====================
/*
 * 本proto文件与Java代码的映射关系：
 * 
 * 请求DTO映射：
 * CreateAnnouncementReq     → CreateAnnouncementRequest.java
 * EditAnnouncementReq       → EditAnnouncementRequest.java
 * UserQueryAnnouncementReq  → UserQueryAnnouncementRequest.java
 * ListAnnouncementReq       → ListAnnouncementRequest.java
 * AdminQueryAnnouncementReq → AdminQueryAnnouncementRequest.java
 * StickyAnnouncementReq     → StickyAnnouncementRequest.java
 * 
 * 响应DTO映射：
 * AnnouncementOperationResp   → AnnouncementOperationResponse.java
 * AnnouncementDetailsResp     → AnnouncementDetailsResponse.java (管理员详情)
 * AnnouncementTinyDetailsResp → AnnouncementTinyDetailsResponse.java (用户详情)
 * ListAnnouncementResp        → ListAnnouncementResponse.java (管理员列表)
 * ListAnnouncementTinyResp    → ListAnnoucementTinyResponse.java (用户列表)
 * 
 * 服务接口映射：
 * AnnouncementService → org.jh.forum.api.service.AnnouncementService.java
 * 
 * 权限设计：
 * - Controller层使用SA-Token进行权限校验(@SaCheckLogin、@SaCheckRole)
 * - 业务权限通过StpUtil.hasRole("super_admin")和isAnnouncementCreator()实现
 * - 超级管理员可操作所有公告， 普通管理员只能操作自己创建的公告
 * 
 * 数据处理：
 * - AutoFillHandler自动填充createUid/updateUid/createTime/updateTime
 * - 时间格式统一使用ISO8601格式：yyyy-MM-dd'T'HH:mm:ssXXX
 * - 用户查询自动筛选已发布公告(status=1)
 * - 软删除通过deleted字段实现， 不进行物理删除
 */

// ==================== 请求消息定义 ====================

/**
 * 创建公告请求
 * 对应Java类：CreateAnnouncementRequest
 */
message CreateAnnouncementReq {
  string title = 1;           // 公告标题， 2-100字符， 必填
  string content = 2;         // 公告内容， 1-1000字符， 必填
  int32 type = 3;            // 公告类型：0=系统公告， 1=学校公告
  string scheduledAt = 4;     // 定时发布时间(可选， ISO8601格式， 如"2025-06-07T09:00:00+08:00")
  int32 status = 5;          // 状态：0=草稿， 1=已发布， 2=待发布， 默认0
  string attribute = 6;       // 附加属性(JSON字符串， 可选， 如"{\"test\": \"test\"}")
  bool sticky = 7;           // 是否置顶， 默认false
}

/**
 * 编辑公告请求
 * 对应Java类：EditAnnouncementRequest
 */
message EditAnnouncementReq {
  int64 id = 1;              // 公告ID， 必须大于等于1， 必填
  string title = 2;          // 公告标题， 2-100字符， 必填
  string content = 3;        // 公告内容， 1-1000字符， 必填
  int32 type = 4;            // 公告类型：0=系统公告， 1=学校公告， 必填
  string scheduledAt = 5;    // 定时发布时间(可选， ISO8601格式)
  int32 status = 6;          // 状态：0=草稿， 1=已发布， 2=待发布， 必填
  string attribute = 7;      // 附加属性(JSON字符串， 可选)
  bool sticky = 8;           // 是否置顶， 可选
}

/**
 * 用户查询公告列表请求
 * 对应Java类：UserQueryAnnouncementRequest
 */
message UserQueryAnnouncementReq {
  int32 page = 1;            // 页码， 默认1， 最小值1
  int32 size = 2;            // 每页数量， 默认8， 最大50
  int32 type = 3;            // 类型筛选：1=系统公告(数据库type=0)， 2=学校公告(数据库type=1)， 3=全部， 默认3
}

/**
 * 查询公告列表请求（内部使用）
 * 对应Java类：ListAnnouncementRequest
 */
message ListAnnouncementReq {
  int32 page = 1;            // 页码， 默认1， 最小值1
  int32 size = 2;            // 每页大小， 默认8， 最大50
  int32 status = 3;          // 状态筛选：0=草稿， 1=已发布， 2=待发布
  int32 type = 4;            // 类型筛选：0=系统公告， 1=学校公告
}

/**
 * 管理员查询公告请求
 * 对应Java类：AdminQueryAnnouncementRequest
 */
message AdminQueryAnnouncementReq {
  int32 page = 1;            // 页码， 默认1
  int32 size = 2;            // 每页大小， 默认8， 最大100
  int32 status = 3;          // 状态筛选：0=草稿， 1=已发布， 2=待发布， 默认0
  int32 orderType = 4;       // 排序方向：0=正序， 1=逆序， 默认0
  bool deleted = 5;          // 是否查询已删除：true=已删除， false=未删除， 默认false
}

// ==================== 基础请求消息定义 ====================

/**
 * 根据ID查询公告详情请求
 */
message GetAnnouncementByIdReq {
  int64 id = 1;              // 公告ID， 必须大于0
}

/**
 * 删除公告请求
 */
message DeleteAnnouncementReq {
  int64 id = 1;              // 公告ID， 必须大于0
}

/**
 * 置顶/取消置顶公告请求
 * 对应Java类：StickyAnnouncementRequest
 * 注意：Java类中字段名为"Sticky"（大写S）， 这可能是个命名错误
 */
message StickyAnnouncementReq {
  int64 id = 1;              // 公告ID， 必须大于0
  bool sticky = 2;           // true=置顶， false=取消置顶， 对应Java中的"Sticky"字段
}

// ==================== 响应消息定义 ====================

/**
 * 公告操作响应
 * 对应Java类：AnnouncementOperationResponse
 */
message AnnouncementOperationResp {
  int64 announceId = 1;      // 公告ID， 与Java中的@JsonProperty("announcement_id")对应
}

/**
 * 公告详情响应（管理员完整版）
 * 对应Java类：AnnouncementDetailsResponse extends AnnouncementTinyDetailsResponse
 */
message AnnouncementDetailsResp {
  int64 id = 1;              // 公告ID， 自增主键
  string title = 2;          // 标题， 最大100字符
  string content = 3;        // 内容， 最大1000字符
  int32 type = 4;            // 类型：0=系统公告， 1=学校公告
  string creator = 5;        // 创建者用户名
  string updator = 6;        // 更新者用户名
  string createdAt = 7;      // 创建时间(ISO8601格式， 如"2025-06-07T09:00:00.000Z")
  string updatedAt = 8;      // 更新时间(ISO8601格式)
  bool sticky = 9;           // 是否置顶， 默认false
  // 以下是管理员专有字段
  int32 status = 10;         // 状态：0=草稿， 1=已发布， 2=待发布
  string scheduledAt = 11;   // 定时发布时间(ISO8601格式， 可空)
  string attribute = 12;     // 附加属性(JSON字符串， 可空)
}

/**
 * 公告简化详情响应（用户版本）
 * 对应Java类：AnnouncementTinyDetailsResponse
 */
message AnnouncementTinyDetailsResp {
  int64 id = 1;              // 公告ID， 自增主键
  string title = 2;          // 标题， 最大100字符
  string content = 3;        // 内容， 最大1000字符
  int32 type = 4;            // 类型：0=系统公告， 1=学校公告
  string creator = 5;        // 创建者用户名
  string updator = 6;        // 更新者用户名
  string createdAt = 7;      // 创建时间(ISO8601格式)
  string updatedAt = 8;      // 更新时间(ISO8601格式)
  bool sticky = 9;           // 是否置顶， 默认false
}

/**
 * 公告列表项（管理员版本）
 * 对应Java类：ListAnnouncementResponse.AnnouncementItemResponse
 */
message AnnouncementItem {
  int64 id = 1;              // 公告ID， 自增主键
  string title = 2;          // 标题， 最大100字符
  int32 type = 3;            // 类型：0=系统公告， 1=学校公告
  int32 status = 4;          // 状态：0=草稿， 1=已发布， 2=待发布
  string creator = 5;        // 创建者用户名
  string updator = 6;        // 更新者用户名
  string createdAt = 7;      // 创建时间(ISO8601格式)
  string updatedAt = 8;      // 更新时间(ISO8601格式)
  string scheduledAt = 9;    // 定时发布时间(ISO8601格式， 可空)
  bool sticky = 10;          // 是否置顶， 默认false
}

/**
 * 公告列表项（用户版本）
 * 对应Java类：ListAnnoucementTinyResponse.AnnouncementItemResponse
 */
message AnnouncementTinyItem {
  int64 id = 1;              // 公告ID， 自增主键
  string title = 2;          // 标题， 最大100字符
  int32 type = 3;            // 类型：0=系统公告， 1=学校公告
  string creator = 4;        // 创建者用户名
  string updator = 5;        // 更新者用户名
  string updatedAt = 6;      // 更新时间(ISO8601格式)， 注意：用户版本没有createdAt
  bool sticky = 7;           // 是否置顶， 默认false
}

/**
 * 公告列表响应（管理员版本）
 * 对应Java类：ListAnnouncementResponse extends BaseListResponse
 */
message ListAnnouncementResp {
  repeated AnnouncementItem list = 1;  // 公告列表
  int32 total = 2;                     // 总数
  int32 page = 3;                      // 当前页
  int32 pageSize = 4;                  // 每页大小， 对应Java中的@JsonProperty("page_size")
}

/**
 * 公告列表响应（用户版本）
 * 对应Java类：ListAnnoucementTinyResponse extends BaseListResponse
 */
message ListAnnouncementTinyResp {
  repeated AnnouncementTinyItem list = 1;  // 公告列表
  int32 total = 2;                         // 总数
  int32 page = 3;                          // 当前页
  int32 pageSize = 4;                      // 每页大小， 对应Java中的@JsonProperty("page_size")
}

// ==================== 服务接口定义 ====================

/**
 * 公告服务接口
 * 对应Java接口：AnnouncementService
 * 
 * 接口设计说明：
 * 1. 所有管理员接口都在Controller层进行权限校验（@SaCheckLogin、@SaCheckRole）
 * 2. 业务权限（如只能操作自己创建的公告）通过StpUtil.hasRole("super_admin")和isAnnouncementCreator()实现
 * 3. 异常处理分层：Manager抛IllegalArgumentException → Service包装为ApiException → Controller返回友好错误
 * 4. 自动填充：AutoFillHandler负责createUid/updateUid/createTime/updateTime字段
 * 5. 时间格式：统一使用ISO8601格式（yyyy-MM-dd'T'HH:mm:ssXXX）
 */
service AnnouncementService {
  /**
   * 创建公告
   * 权限：管理员（admin或super_admin）
   * 对应Controller：POST /announcements
   * 自动填充：createUid, createTime
   */
  rpc createAnnouncement(CreateAnnouncementReq) returns (ServiceResult);

  /**
   * 根据ID查询公告详情（管理员版本）
   * 权限：管理员（admin或super_admin）
   * 对应Controller：GET /announcements/see?id=123
   * 返回：包含status、scheduledAt、attribute等管理员字段
   */
  rpc getAnnouncementById(GetAnnouncementByIdReq) returns (ServiceResult);

  /**
   * 根据ID查询公告详情（用户版本）
   * 权限：无需登录（但只能查看已发布的公告）
   * 对应Controller：GET /announcements?id=123
   * 返回：简化版本， 不包含管理员字段
   * 业务规则：强制status=1， 未发布公告返回异常
   */
  rpc getAnnouncementTinyDetailsById(GetAnnouncementByIdReq) returns (ServiceResult);

  /**
   * 查询公告列表（内部使用）
   * 用于Service层内部调用， 支持status筛选
   */
  rpc listAnnouncements(ListAnnouncementReq) returns (ServiceResult);

  /**
   * 用户查询公告列表
   * 权限：无需登录
   * 对应Controller：GET /announcements/list
   * 业务规则：自动筛选已发布公告(status=1)， 支持类型筛选
   * 返回：简化版本的公告列表， 不包含管理员字段
   */
  rpc userQueryAnnouncements(UserQueryAnnouncementReq) returns (ServiceResult);

  /**
   * 编辑公告
   * 权限：管理员（admin或super_admin）
   * 对应Controller：PUT /announcements
   * 业务权限：普通管理员只能编辑自己创建的公告， 超级管理员可编辑所有公告
   * 自动填充：updateUid, updateTime
   */
  rpc editAnnouncement(EditAnnouncementReq) returns (ServiceResult);

  /**
   * 删除公告（软删除）
   * 权限：管理员（admin或super_admin）
   * 对应Controller：DELETE /announcements?id=123
   * 业务权限：普通管理员只能删除自己创建的公告， 超级管理员可删除所有公告
   * 实现：设置deleted=true， 而非物理删除
   */
  rpc deleteAnnouncement(DeleteAnnouncementReq) returns (ServiceResult);

  /**
   * 置顶/取消置顶公告
   * 权限：管理员（admin或super_admin）
   * 对应Controller：PUT /announcements/sticky
   * 业务权限：普通管理员只能操作自己创建的公告， 超级管理员可操作所有公告
   */
  rpc stickyAnnouncement(StickyAnnouncementReq) returns (ServiceResult);

  /**
   * 管理员查询公告列表
   * 权限：管理员（admin或super_admin）
   * 对应Controller：GET /announcements/query
   * 支持：复杂筛选、排序、已删除公告查询、关键词搜索
   * 返回：完整的公告信息， 包含所有管理员字段
   */
  rpc adminQueryAnnouncements(AdminQueryAnnouncementReq) returns (ServiceResult);
}
