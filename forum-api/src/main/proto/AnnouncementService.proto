syntax = "proto3";
import "Base.proto";
option java_multiple_files = true;

package org.jh.forum.api.dubbo;

/**
 * 创建公告请求
 */
message CreateAnnouncementReq {
  string title = 1;           // 公告标题，2-100字符
  string content = 2;         // 公告内容，1-1000字符
  int32 type = 3;            // 公告类型：0=系统公告，1=学校公告
  string scheduledAt = 4;     // 定时发布时间(可选，ISO8601格式)
  int32 status = 5;          // 状态：0=草稿，1=已发布，2=待发布，默认0
  string attribute = 6;       // 附加属性(JSON字符串，可选)
  bool sticky = 7;           // 是否置顶，默认false
}

/**
 * 编辑公告请求
 */
message EditAnnouncementReq {
  int64 id = 1;              // 公告ID，必须大于等于1
  string title = 2;          // 公告标题，2-100字符
  string content = 3;        // 公告内容，1-1000字符
  int32 type = 4;            // 公告类型：0=系统公告，1=学校公告
  string scheduledAt = 5;    // 定时发布时间(可选，ISO8601格式)
  int32 status = 6;          // 状态：0=草稿，1=已发布，2=待发布
  string attribute = 7;      // 附加属性(JSON字符串)
  bool sticky = 8;           // 是否置顶
}

/**
 * 查询公告列表请求
 */
message ListAnnouncementReq {
  int32 page = 1;            // 页码，默认1，最小值1
  int32 size = 2;            // 每页大小，默认8
  int32 status = 3;          // 状态筛选：0=草稿，1=已发布，2=待发布
  int32 type = 4;            // 类型筛选：1=系统公告，2=学校公告，3=全部
}

/**
 * 管理员查询公告请求
 */
message AdminQueryAnnouncementReq {
  int32 page = 1;            // 页码
  int32 size = 2;            // 每页大小
  string orderField = 3;     // 排序字段
  string orderDirection = 4; // 排序方向
}

/**
 * 根据ID查询公告详情请求
 */
message GetAnnouncementByIdReq {
  int64 id = 1;              // 公告ID
}

/**
 * 删除公告请求
 */
message DeleteAnnouncementReq {
  int64 id = 1;              // 公告ID
}

/**
 * 置顶/取消置顶公告请求
 */
message StickyAnnouncementReq {
  int64 id = 1;              // 公告ID
  bool sticky = 2;           // true=置顶，false=取消置顶
}

/**
 * 公告操作响应
 */
message AnnouncementOperationResp {
  int64 announceId = 1;      // 公告ID，自增主键
}

/**
 * 公告详情响应
 */
message AnnouncementDetailsResp {
  int64 id = 1;              // 公告ID，自增主键
  string title = 2;          // 标题，最大100字符
  string content = 3;        // 内容，最大1000字符
  int32 type = 4;            // 类型：0=系统公告，1=学校公告
  int32 status = 5;          // 状态：0=草稿，1=已发布，2=待发布
  string creator = 6;        // 创建者用户名
  string updator = 7;        // 更新者用户名
  string createdAt = 8;      // 创建时间(ISO8601格式)
  string updatedAt = 9;      // 更新时间(ISO8601格式)
  string scheduledAt = 10;   // 定时发布时间(ISO8601格式，可空)
  string attribute = 11;     // 附加属性(JSON字符串，可空)
  bool sticky = 12;          // 是否置顶，默认false
}

/**
 * 公告列表项
 */
message AnnouncementItem {
  int64 id = 1;              // 公告ID，自增主键
  string title = 2;          // 标题，最大100字符
  int32 type = 3;            // 类型：0=系统公告，1=学校公告
  int32 status = 4;          // 状态：0=草稿，1=已发布，2=待发布
  string creator = 5;        // 创建者用户名
  string updator = 6;        // 更新者用户名
  string createdAt = 7;      // 创建时间(ISO8601格式)
  string updatedAt = 8;      // 更新时间(ISO8601格式)
  bool sticky = 9;           // 是否置顶，默认false
}

/**
 * 公告列表响应
 */
message ListAnnouncementResp {
  repeated AnnouncementItem list = 1;  // 公告列表
  int32 total = 2;                     // 总数
  int32 page = 3;                      // 当前页
  int32 pageSize = 4;                  // 每页大小
}

/**
 * 公告服务接口
 */
service AnnouncementService {
  /**
   * 创建公告
   */
  rpc createAnnouncement(CreateAnnouncementReq) returns (ServiceResult);
  /**
   * 根据ID查询公告详情
   */
  rpc getAnnouncementById(GetAnnouncementByIdReq) returns (ServiceResult);

  /**
   * 查询公告列表
   */
  rpc listAnnouncements(ListAnnouncementReq) returns (ServiceResult);

  /**
   * 编辑公告
   */
  rpc editAnnouncement(EditAnnouncementReq) returns (ServiceResult);

  /**
   * 删除公告
   */
  rpc deleteAnnouncement(DeleteAnnouncementReq) returns (ServiceResult);

  /**
   * 置顶/取消置顶公告
   */
  rpc stickyAnnouncement(StickyAnnouncementReq) returns (ServiceResult);

  /**
   * 管理员查询公告列表
   */
  rpc adminQueryAnnouncements(AdminQueryAnnouncementReq) returns (ServiceResult);
}
