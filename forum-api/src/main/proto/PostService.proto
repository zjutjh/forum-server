syntax = "proto3";
import "Base.proto";
option java_multiple_files = true;

package org.jh.forum.api.dubbo;

/**
 * 请求参数
 */
message PublishPostReq {
  int64 userId = 1;
  string title = 2;
  string content = 3;
  int64 categoryId = 4;
  repeated string topics = 5;
}

service PostService {
  rpc publishPost(PublishPostReq) returns (ServiceResult);
}
